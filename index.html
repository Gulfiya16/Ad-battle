
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ad Game</title>

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter&display=swap" rel="stylesheet">

<style>
body {
  margin:0;
  font-family:'Inter',sans-serif;
  background:#111;
  color:#fff;
}

.screen { display:none; padding:20px; }
.screen.active { display:block; }

/* Buttons */
button {
  padding:10px 14px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

/* Magazine */
.magazine {
  background:#fff;
  color:#111;
  border-radius:14px;
  padding:16px;
  max-width:400px;
  margin:auto;
  display:flex;
  flex-direction:column;
  gap:12px;
  font-family:'Playfair Display',serif;
}

.mag-header input {
  width:100%;
  font-size:1.4rem;
  border:none;
  border-bottom:2px solid #ddd;
  outline:none;
}

.mag-body textarea {
  width:100%;
  height:120px;
  border:none;
  outline:none;
}

.mag-footer {
  display:flex;
  justify-content:space-between;
}

/* Bookshelf */
.bookshelf {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
  gap:12px;
}

.book {
  background:linear-gradient(135deg,#ffb347,#ffcc33);
  color:#222;
  padding:10px;
  border-radius:8px;
  cursor:pointer;
}

/* Results */
.result-card {
  display:flex;
  gap:10px;
  padding:10px;
  border-bottom:1px solid #333;
}
.rank { color:gold; font-weight:bold; }
</style>
</head>

<body>

<!-- STUDENT -->
<div id="s-ad" class="screen active">
  <h2>Create Ad</h2>
  <div class="magazine">
    <input id="ad-title" placeholder="Brand name">
    <textarea id="ad-caption" placeholder="Write your ad"></textarea>
    <div class="mag-footer">
      <input id="ad-price" type="number" placeholder="₩">
      <button onclick="submitAd()">Publish</button>
    </div>
  </div>
</div>

<div id="s-wait" class="screen">
  <h2>Waiting...</h2>
</div>

<div id="s-vote" class="screen">
  <h2>Vote</h2>
  <div id="vote-cards" class="bookshelf"></div>
</div>

<div id="s-results" class="screen">
  <h2>Results</h2>
  <div id="results"></div>
</div>

<!-- TEACHER -->
<div id="s-teacher" class="screen">
  <h2>Teacher Panel</h2>
  <button onclick="setPhase('work')">Work</button>
  <button onclick="setPhase('vote')">Vote</button>
  <button onclick="setPhase('results')">Results</button>
  <button onclick="resetAll()">Reset</button>
</div>

<script type="module">
// 🔥 PUT YOUR FIREBASE CONFIG HERE
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, set, update, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  // your config
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let state = { phase:'work', ads:{}, votes:{} };
const sessionRef = ref(db,'session');

onValue(sessionRef, snap=>{
  state = snap.val() || state;
  sync();
});

function go(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function setPhase(p){
  update(sessionRef,{phase:p});
}

function resetAll(){
  set(sessionRef,{phase:'work',ads:{},votes:{}});
}

// STUDENT ID
const user = localStorage.user || (localStorage.user=Math.random().toString(36).slice(2));
const group = Math.floor(Math.random()*5); // simple grouping

function submitAd(){
  const ad={
    groupId:group,
    groupName:'Group '+group,
    caption:document.getElementById('ad-caption').value,
    price:document.getElementById('ad-price').value
  };
  update(ref(db,'session/ads/'+group),ad);
  go('s-wait');
}

function sync(){
  if(state.phase==='work'){
    if(state.ads && state.ads[group]){
      go('s-wait');
    } else {
      go('s-ad');
    }
  }

  if(state.phase==='vote'){
    buildVote();
    go('s-vote');
  }

  if(state.phase==='results'){
    showResults();
    go('s-results');
  }
}

function buildVote(){
  const container=document.getElementById('vote-cards');
  container.innerHTML='';

  Object.values(state.ads||{})
    .filter(ad=>ad.groupId!==group)
    .forEach(ad=>{
      const el=document.createElement('div');
      el.className='book';
      el.innerHTML=`
        <strong>${ad.groupName}</strong><br>
        ${ad.caption}<br>
        ${ad.price}₩
      `;
      el.onclick=()=>vote(ad.groupId);
      container.appendChild(el);
    });
}

function vote(gid){
  update(ref(db,'session/votes/'+user),{groupId:gid});
}

function showResults(){
  const counts={};
  Object.values(state.votes||{}).forEach(v=>{
    counts[v.groupId]=(counts[v.groupId]||0)+1;
  });

  const res=Object.values(state.ads||{}).map(a=>({
    ...a,
    votes:counts[a.groupId]||0
  })).sort((a,b)=>b.votes-a.votes);

  document.getElementById('results').innerHTML =
    res.map((r,i)=>`
      <div class="result-card">
        <div class="rank">#${i+1}</div>
        <div>${r.groupName} - ${r.votes} votes</div>
      </div>
    `).join('');
}
</script>

</body>
</html>
```
