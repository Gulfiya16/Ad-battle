<script>
// ── SAFE FIREBASE INIT ───────────────────────
let fb = null;
let sessionRef = null;
let unsubscribe = null;
let cachedState = { phase:'work', ads:{}, votes:{}, members:{} };

(function waitForFb() {
  if (window._fb) {
    fb = window._fb;
    sessionRef = fb.ref(fb.db, 'session');
    startListening();
    console.log('Firebase connected ✓');
  } else {
    setTimeout(waitForFb, 50);
  }
})();

// ── SAFE LISTENER (NO CRASHES) ───────────────
function startListening() {
  if (!sessionRef) return;

  if (unsubscribe) unsubscribe();

  unsubscribe = fb.onValue(sessionRef, snap => {
    const data = snap.val() || { phase:'work', ads:{}, votes:{}, members:{} };
    cachedState = data;

    // Always update teacher safely
    renderTeacherSafe(data);

    // Sync student view safely
    syncViewSafe(data);
  });
}

// ── SAFE FIREBASE UPDATE ─────────────────────
async function fbUpdate(path, value) {
  if (!fb) return;

  const r = fb.ref(fb.db, path);

  if (typeof value === 'object' && !Array.isArray(value)) {
    await fb.update(r, value);
  } else {
    await fb.set(r, value);
  }
}

// ── TEACHER PHASE CONTROL ────────────────────
async function setPhase(phase) {
  await fbUpdate('session/phase', phase);
  showToast('Phase: ' + phase + ' ✓');
}

// ── FIXED RESET ──────────────────────────────
async function resetAll() {
  if (!confirm('Reset everything?')) return;

  await fb.set(fb.ref(fb.db, 'session'), {
    phase: 'work',
    ads: {},
    votes: {},
    members: {}
  });

  showToast('Session reset ✓');
}

// ── SAFE TEACHER RENDER (NO CRASH) ───────────
function renderTeacherSafe(state) {
  const ts = document.getElementById('t-submitted');
  const tv = document.getElementById('t-votes');
  const list = document.getElementById('teacher-ads-list');

  if (!ts || !tv || !list) return; // ← prevents crash

  const submitted = Object.keys(state.ads || {}).length;
  const votes = Object.keys(state.votes || {}).length;

  ts.innerHTML = submitted + '<span style="font-size:1rem;color:gray">/5</span>';
  tv.textContent = votes;

  ['work','vote','results'].forEach(p => {
    const btn = document.getElementById('pbtn-' + p);
    if (btn) btn.classList.toggle('active', state.phase === p);
  });

  if (submitted === 0) {
    list.innerHTML = '<p>No ads yet…</p>';
    return;
  }

  list.innerHTML = Object.values(state.ads).map(ad => `
    <div style="padding:8px;border-bottom:1px solid #333">
      <strong>${ad.groupName}</strong><br>
      <span style="font-size:.85rem">"${ad.caption}"</span><br>
      <span style="color:gold">${ad.price}₩</span>
    </div>
  `).join('');
}

// ── SAFE VIEW SYNC ───────────────────────────
function syncViewSafe(state) {
  const active = document.querySelector('.screen.active')?.id;
  if (!active) return;

  if (active === 's-waiting') {
    if (state.phase === 'vote') goToVoteSafe();
    if (state.phase === 'results') showResultsSafe(state);
  }

  if (active === 's-vote' && state.phase === 'results') {
    showResultsSafe(state);
  }
}

// ── SAFE VOTE ────────────────────────────────
function goToVoteSafe() {
  const container = document.getElementById('vote-cards');
  if (!container) return;

  container.innerHTML = '';

  Object.values(cachedState.ads || {}).forEach(ad => {
    const el = document.createElement('div');
    el.innerHTML = `
      <div style="border:1px solid #444;padding:10px;margin-bottom:10px">
        <strong>${ad.groupName}</strong><br>
        "${ad.caption}"<br>
        <span style="color:lime">${ad.price}₩</span><br>
        <button onclick="castVoteSafe('${ad.groupId}')">BUY</button>
      </div>
    `;
    container.appendChild(el);
  });

  go('s-vote');
}

async function castVoteSafe(groupId) {
  if (!window.voterKey) return;

  await fbUpdate('session/votes/' + voterKey, {
    groupId
  });

  go('s-voted');
}

// ── SAFE RESULTS ─────────────────────────────
function showResultsSafe(state) {
  const list = document.getElementById('results-list');
  if (!list) return;

  const counts = {};

  Object.values(state.votes || {}).forEach(v => {
    counts[v.groupId] = (counts[v.groupId] || 0) + 1;
  });

  const results = Object.values(state.ads || {}).map(ad => ({
    ...ad,
    votes: counts[ad.groupId] || 0
  })).sort((a,b) => b.votes - a.votes);

  list.innerHTML = results.map(r => `
    <div style="padding:10px;border-bottom:1px solid #333">
      <strong>${r.groupName}</strong> — ${r.votes} votes<br>
      "${r.caption}"
    </div>
  `).join('');

  go('s-results');
}

// ── UTIL ─────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  if (!t) return;
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}
</script>
